name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo 'Missing RELEASE_KEYSTORE_BASE64 secret.' >&2; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo 'Missing RELEASE_STORE_PASSWORD secret.' >&2; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo 'Missing RELEASE_KEY_ALIAS secret.' >&2; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo 'Missing RELEASE_KEY_PASSWORD secret.' >&2; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          {
            printf 'storeFile=release-key.jks\n'
            printf 'storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PreleaseAbiSplits --no-daemon --console=plain

      - name: Prepare release assets
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_dir="app/build/release-assets"
          output_dir="app/build/outputs/apk/release"
          mkdir -p "$release_dir"
          cp "$output_dir/app-universal-release.apk" "$release_dir/Lagrange-${release_version}.apk"
          cp "$output_dir/app-arm64-v8a-release.apk" "$release_dir/Lagrange-${release_version}-arm.apk"
          cp "$output_dir/app-x86-release.apk" "$release_dir/Lagrange-${release_version}-x86.apk"
          cp "$output_dir/app-x86_64-release.apk" "$release_dir/Lagrange-${release_version}-x86_64.apk"
          printf 'RELEASE_ASSETS=' >> "$GITHUB_ENV"
          printf '%s\n' "$release_dir"/Lagrange-${release_version}.apk "$release_dir"/Lagrange-${release_version}-arm.apk "$release_dir"/Lagrange-${release_version}-x86.apk "$release_dir"/Lagrange-${release_version}-x86_64.apk | paste -sd ' ' - >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_notes="docs/release-notes/v${release_version}.md"
          test -f "$release_notes" || { echo "Missing release notes: $release_notes" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" $RELEASE_ASSETS --verify-tag --notes-file "$release_notes" --title "Lagrange ${release_version}"
